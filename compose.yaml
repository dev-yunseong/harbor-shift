services:
  harbor-shift:
    image: ghcr.io/dev-yunseong/harbor-shift:latest
    command: ["/config/harbor.yml", "--apply"]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/config:ro
      - harbor-state:/state
    networks: [harbor]
    restart: "no"
    stop_grace_period: 90m
networks:
  harbor:
    name: harbor-demo
volumes:
  harbor-state:
